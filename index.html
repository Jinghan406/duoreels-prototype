<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Duoreels · Hi-fi prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--surface:#1C1C1E;--control:#2C2C30;--line:#2C2C30;--white:#fff;--grey:#B0B0B8;--meta:#8A8A92;
  --violet:#8E6CFF;--brand:#6929D4;--ink:#100B19;--blue:#3D8BFF;--orange:#FF9A4D;--teal:#2EC4B6;--green:#3DE0A0;--yellow:#FFC94D;
  --disp:'Big Shoulders Display',Impact,sans-serif;--ui:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--cut:21px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B0B0D;color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:#fff}
img{display:block}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:22px 28px}
/* ---------- side map ---------- */
#map{width:260px;align-self:stretch;max-height:calc(100vh - 56px);overflow:auto;padding:4px 4px 24px}
#map h1{font-family:var(--disp);font-weight:900;font-size:40px;letter-spacing:.01em;margin:0 0 4px;line-height:1}
#map p{color:var(--meta);font-size:13px;margin:0 0 22px;line-height:1.45}
#map h2{font:600 13px var(--ui);letter-spacing:.1em;color:var(--meta);margin:20px 0 8px;text-transform:uppercase}
#map button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;color:#ddd;gap:8px;align-items:center}
#map button:hover{background:#1C1C1E;color:#fff}
#map button .n{font:500 11px var(--mono);color:var(--meta);width:22px}
#map .sim{border:1px dashed #3a3a42;margin-top:6px}
@media (max-width:820px){#map{display:none}#stage{padding:0}}
/* ---------- phone ---------- */
#phone{position:relative;width:390px;height:844px;background:#000;border-radius:54px;overflow:hidden;overflow:clip;transform-origin:center center;box-shadow:0 0 0 10px #18181B,0 0 0 11px #2a2a2f,0 40px 120px rgba(105,41,212,.25);flex:none}
@media (max-width:500px){#phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.sbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;z-index:60;pointer-events:none;font:600 16px var(--ui)}
.sbar .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:61}
.hind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:#fff;z-index:90;pointer-events:none;opacity:.9}
#views{position:absolute;inset:0;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;background:#000;overflow:hidden;overflow:clip;display:flex;flex-direction:column;transition:transform .42s var(--ease),opacity .42s var(--ease),filter .42s}
.view.in-r{transform:translateX(100%)}
.view.out-l{transform:translateX(-28%);filter:brightness(.45)}
.view.in-l{transform:translateX(-28%);filter:brightness(.45)}
.view.out-r{transform:translateX(100%)}
.view.fade-in{opacity:0;transform:scale(.985)}
.view.fade-out{opacity:0}
.view.up-in{transform:translateY(100%)}
.view.down-out{transform:translateY(100%)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:47px}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
/* ---------- type ---------- */
.ptitle{font:900 48px/0.95 var(--disp);letter-spacing:.005em;text-transform:uppercase;margin:0}
.wm{font:900 30px/1 var(--disp);letter-spacing:.02em}
.t28{font:700 28px/1.15 var(--ui);margin:0}
.t20{font:700 20px/1.2 var(--ui);margin:0}
.t17{font:600 17px/1.25 var(--ui)}
.t15{font:400 15px/1.45 var(--ui)}
.lab{font:600 13px var(--ui)}
.meta{font:400 12px/1.4 var(--ui);color:var(--meta)}
.grey{color:var(--grey)}
.mono{font-family:var(--mono);font-weight:500}
.sec{font:600 13px var(--ui);letter-spacing:.1em;color:var(--meta);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec a,.sec button{letter-spacing:0;text-transform:none;font:600 13px var(--ui);color:#fff}
/* ---------- components ---------- */
.btn-main{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;width:100%;background:var(--violet);color:#000;font:900 20px var(--disp);letter-spacing:.03em;text-transform:uppercase;border-radius:12px;transition:transform .15s,background .2s,filter .2s}
.btn-main:active{transform:translateY(1px);background:var(--brand);color:#fff}
.btn-main[disabled]{background:var(--control);color:#6a6a72;pointer-events:none}
.btn-main.white{background:#fff}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:8px;background:var(--control);font:600 15px var(--ui);transition:background .2s,transform .12s}
.btn-sec:active{transform:scale(.97);background:#3a3a40}
.btn-sec.sm{height:36px;font-size:13px;padding:0 12px}
.btn-card{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border-radius:8px;border:1.5px solid #fff;font:900 18px var(--disp);letter-spacing:.03em;text-transform:uppercase;transition:background .2s,color .2s}
.btn-card:active{background:#fff;color:#000}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 13px;font:900 14px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#000;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);white-space:nowrap}
.tag.green{background:var(--green)}.tag.yellow{background:var(--yellow)}.tag.violet{background:var(--violet)}.tag.grey{background:var(--control);color:#fff}.tag.blue{background:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #3a3a42;font:600 13px var(--ui);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.row::-webkit-scrollbar{display:none}
.seg{display:flex;background:#141416;border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;height:30px;border-radius:6px;font:600 13px var(--ui);color:var(--grey);transition:background .25s,color .25s;white-space:nowrap;padding:0 12px}
.seg button.on{background:#fff;color:#000}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#000;font-weight:700;flex:none;box-shadow:0 0 0 2px #000}
.avs{display:flex}.avs .av+.av{margin-left:-7px}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s}
.ib:active{background:#1C1C1E}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--c,var(--violet));flex:none}
.card{background:var(--surface);border-radius:12px}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border-radius:12px;width:100%;text-align:left;transition:background .2s,transform .15s}
.row:active{background:#26262A;transform:scale(.99)}
.row .tx{flex:1;min-width:0}
.row .tx .meta{margin-top:2px}
.rows{display:flex;flex-direction:column;gap:10px}
.list{background:var(--surface);border-radius:12px;overflow:hidden}
.list>.row{border-radius:0;background:transparent}
.list>.row+.row{border-top:1px solid #2a2a2e}
.thumb{background-size:cover;background-position:center;border-radius:8px;flex:none}
.field{background:var(--surface);border-radius:8px;padding:13px 14px;width:100%;border:1.5px solid transparent;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--violet)}
textarea.field{resize:none;min-height:92px;line-height:1.45}
.lbl{font:600 13px var(--ui);letter-spacing:.1em;color:var(--meta);text-transform:uppercase;margin:20px 0 8px;display:block}
.topbar{display:flex;align-items:center;gap:6px;height:54px;padding:0 10px 0 6px;flex:none}
.topbar .tt{flex:1;min-width:0}
.topbar .tt b{display:block;font:600 17px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tt span{display:flex;align-items:center;gap:6px;font:400 13px var(--ui);color:var(--meta);margin-top:1px}
.fixedtop{position:absolute;top:0;left:0;right:0;z-index:20;padding-top:47px;transition:background .3s,backdrop-filter .3s}
.fixedtop.glass{background:rgba(0,0,0,.6);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.toggle{width:46px;height:28px;border-radius:14px;background:#3a3a42;position:relative;transition:background .25s;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.toggle.on{background:var(--violet)}.toggle.on::after{transform:translateX(18px)}
.bar{height:4px;border-radius:4px;background:#2C2C30;overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:4px;transition:width .6s var(--ease)}
.glow-floor{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(16,11,25,0) 0%,rgba(105,41,212,.55) 70%,#6929D4 100%);filter:blur(10px);pointer-events:none}
/* ---------- tab bar ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;padding:8px 12px 0;z-index:40;background:rgba(0,0,0,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.06);transition:transform .38s var(--ease)}
#tabbar.hide{transform:translateY(110%)}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;color:var(--meta);font:500 13px var(--ui);transition:color .2s}
#tabbar button.on{color:#fff}
/* ---------- home cards ---------- */
.pcard{position:relative;display:flex;align-items:flex-start;gap:12px;background:var(--surface);border-radius:12px;padding:12px;width:100%;text-align:left;margin-top:14px;transition:transform .15s,box-shadow .4s}
.pcard:active{transform:scale(.985)}
.pcard .tag{position:absolute;top:-12px;right:46px}
.pcard.turn{}
.pcard.turn.ed{}
@keyframes turnlight{50%{box-shadow:0 0 0 1px rgba(142,108,255,.9),0 0 34px -4px rgba(142,108,255,.75)}}
@keyframes turnlightb{50%{box-shadow:0 0 0 1px rgba(61,139,255,.9),0 0 34px -4px rgba(61,139,255,.75)}}
.pcard .tx{flex:1;min-width:0}
.pcard .tx b{font:600 16px var(--ui);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .btn-card{height:32px;font-size:16px;padding:0 14px}
.pcard .tx .s{display:flex;align-items:center;gap:7px;margin-top:4px;font:400 13px var(--ui);color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:112px;text-align:left}
.rail .thumb{width:112px;height:112px;border-radius:10px;position:relative}
.dur{position:absolute;left:6px;bottom:6px;font:500 13px var(--mono);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:2px 6px;border-radius:6px}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px}
.grid2 .gcard .tag{font-size:13px;height:20px;padding:0 9px}
.grid2 .dur{font-size:13px;padding:1px 5px}
.gcard{text-align:left}
.gcard .thumb{width:100%;aspect-ratio:1;border-radius:12px;position:relative}
.gcard .thumb .tag{position:absolute;left:6px;top:8px;height:22px;font-size:13px}
.gcard b{display:block;font:600 14px var(--ui);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- sheet / toast / banner ---------- */
#sheet-host{position:absolute;inset:0;z-index:70;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .45s var(--ease);max-height:88%;display:flex;flex-direction:column;padding-bottom:30px}
.sheet .grab{width:38px;height:5px;border-radius:5px;background:#48484f;margin:9px auto 4px;flex:none}
.sheet .sbody{overflow-y:auto;padding:6px 16px 0;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
#sheet-host.open{pointer-events:auto}
#sheet-host.open .backdrop{opacity:1}
#sheet-host.open .sheet{transform:none}
#toast-host{position:absolute;left:12px;right:12px;bottom:100px;z-index:80;display:flex;justify-content:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(28,28,30,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);font:500 14px var(--ui);pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:toastIn .5s var(--ease) both}
.toast.out{animation:toastOut .35s ease both}
.toast button{color:var(--violet);font-weight:600}
@keyframes toastIn{from{opacity:0;transform:translate(-30px,14px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translate(30px,-13px)}}
#banner{position:absolute;top:50px;left:10px;right:10px;z-index:85;transform:translateY(-220px);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
#banner.show{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
#banner .in{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(36,36,40,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,.6);cursor:pointer}
.check{width:22px;height:22px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;color:#000;flex:none}
/* ---------- review ---------- */
.player{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.player .vid{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:4px;overflow:hidden;cursor:crosshair}
.player .vid img{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%;transition:transform 8s linear}
.player.playing .vid img{transform:scale(1.08)}
.pinb{position:absolute;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border-radius:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 13px var(--ui);animation:pop .4s var(--ease) both;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinb .mono{font-size:13px;color:var(--grey)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.timerow{display:flex;align-items:center;gap:6px;padding:10px 16px 6px;flex:none}
.timerow .mono{font-size:13px;width:96px}
.vchip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:8px;background:var(--control);font:600 13px var(--ui)}
.strip{position:relative;height:56px;margin:22px 16px 4px;border-radius:6px;flex:none;touch-action:none;cursor:pointer}
.strip .frames{position:absolute;inset:0;display:flex;gap:2px;border-radius:6px;overflow:hidden}
.strip .frames i{flex:1;background-size:cover;background-position:center;opacity:.85}
.strip .ph{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;border-radius:2px;margin-left:-1.5px;box-shadow:0 0 8px rgba(0,0,0,.6);pointer-events:none}
.strip .pin{position:absolute;top:-24px;margin-left:-11px;display:flex;flex-direction:column;align-items:center;animation:pop .45s var(--ease) both;pointer-events:none}
.strip .pin .av{width:22px;height:22px;font-size:11px}
.strip .pin::after{content:'';width:2px;height:58px;background:var(--c);margin-top:2px;opacity:.9}
.ticks{display:flex;justify-content:space-between;padding:0 16px;font:500 13px var(--mono);color:var(--meta);flex:none}
.tools{display:flex;align-items:center;padding:8px 12px 30px;gap:4px;flex:none}
.tools .tl{width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 13px var(--ui);color:#ddd;padding:6px 0;border-radius:10px;transition:background .2s}
.tools .tl:active,.tools .tl.on{background:#1C1C1E}
.tools .tl.on{color:var(--violet)}
.notesbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:8px;background:var(--surface);font:600 15px var(--ui)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--violet);color:#000;font:700 13px var(--ui);display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.voicebar{margin:0 12px 30px;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,rgba(142,108,255,.35),rgba(61,139,255,.35));box-shadow:0 0 40px rgba(110,120,255,.35);animation:voicein .4s var(--ease)}
@keyframes voicein{from{opacity:0;transform:translateY(20px)}}
.wave{display:flex;gap:3px;align-items:center;height:28px;flex:1}
.wave i{width:3px;border-radius:2px;background:#fff;animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:26px}}
.nrow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #2a2a2e;position:relative;background:var(--surface);transition:transform .45s var(--ease),opacity .45s}
.nrow .nt{width:44px;height:58px;border-radius:4px;background-size:cover;background-position:center;flex:none;position:relative}
.nrow .nt .av{position:absolute;left:-5px;bottom:-5px;width:18px;height:18px;font-size:9px}
.nrow.fly{transform:translate(160px,-71px);opacity:0}
.nrow.done{opacity:.45}
.circ{width:24px;height:24px;border-radius:50%;border:1.5px solid #6a6a72;flex:none;display:inline-flex;align-items:center;justify-content:center;transition:all .25s}
.circ.on{background:var(--green);border-color:var(--green);color:#000}
.att{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;border:1px solid #3a3a42;font:500 13px var(--ui);color:var(--grey);margin-top:6px}
.shimmer{background:linear-gradient(90deg,#444 0%,#fff 40%,#444 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:6}
.overlay{position:absolute;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.ocard{background:rgba(28,28,30,.9);border-radius:16px;padding:24px;width:280px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .4s var(--ease)}
.drawc{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.cmp{position:absolute;inset:0;overflow:hidden}
.cmp img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.85)}
.cmp .div{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.6)}
.cmp .div::after{content:'⇆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:14px}
.vlabel{position:absolute;top:10px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.6);font:600 13px var(--ui)}
/* path / round counter */
.rounds{display:flex;gap:6px;margin:10px 0 6px}
.rounds i{flex:1;height:10px;background:var(--control);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.rounds i.on{background:var(--violet)}
.path{display:flex;align-items:flex-start;justify-content:space-between;margin:12px 0 4px}
.path .st{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 13px var(--ui);color:var(--meta);width:44px}
.path .st .c{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a4a52;display:flex;align-items:center;justify-content:center}
.path .st.ok .c{background:#2C2C30;border-color:#2C2C30;color:#fff}
.path .st.now{color:#fff;font-weight:600}
.path .st.now .c{border:0}
.path .st.next .c{border-style:dashed}

const stack=[]; let curEl=null; let cleanup=null;

function render(name,params={}){ return V[name](params||{}); }
function mount(entry,how){
  const host=$('#views'); const out=curEl;
  if(cleanup){try{cleanup()}catch(e){} cleanup=null;}
  const r=render(entry.name,entry.params);
  const el=document.createElement('div'); el.className='view'; el.innerHTML=r.html; el.dataset.name=entry.name;
  const cls={push:['in-r','out-l'],pop:['in-l','out-r'],tab:['fade-in','fade-out'],up:['up-in','fade-out'],none:[null,null]}[how]||[null,null];
  if(cls[0]) el.classList.add(cls[0]);
  if(how==='pop'&&out) out.style.zIndex=2;
  if(out){ if(how==='none') out.remove(); else out.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id')); }
  host.appendChild(el); curEl=el;
  // tabbar
  const tb=$('#tabbar'); tb.classList.toggle('hide',!r.tab);
  if(r.tab) drawTabs(r.tab);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(cls[0]) el.classList.remove(cls[0]); if(out&&cls[1]) out.classList.add(cls[1]); }));
  if(out){ setTimeout(()=>out.remove(), how==='none'?0:460); }
  // glass on scroll
  const sc=$('.scroll',el), ft=$('.fixedtop',el);
  if(sc&&ft){ sc.addEventListener('scroll',()=>ft.classList.toggle('glass',sc.scrollTop>6),{passive:true}); }
  if(r.mount) cleanup=r.mount(el)||null;
  if(entry.scroll&&sc) sc.scrollTop=entry.scroll;
}
function go(name,params={},how='push'){ if(curEl&&stack.length){ const sc=$('.scroll',curEl); stack[stack.length-1].scroll=sc?sc.scrollTop:0; } closeSheet(true); stack.push({name,params}); mount({name,params},how); }
function back(){ closeSheet(true); if(stack.length<=1) return; stack.pop(); mount(stack[stack.length-1],'pop'); }
function reset(name,params={},how='tab'){ closeSheet(true); stack.length=0; stack.push({name,params}); mount({name,params},how); }
function refresh(){ const e=stack[stack.length-1]; const sc=curEl&&$('.scroll',curEl); e.scroll=sc?sc.scrollTop:0; mount(e,'none'); }

 else if(p.asks) now=`<div class="nowcard"><span class="tag yellow">${edName(p)} asks +1 day</span><h3 style="margin-top:12px">Until Sat?</h3><p class="meta" style="margin:0 0 14px">"Need one more day for the colour pass." — ${edName(p)}</p><div style="display:flex;gap:10px"><button class="btn-main" style="flex:1" data-act="askYes" data-id="${p.id}">Give 1 day</button><button class="btn-sec" data-act="askNo" data-id="${p.id}">Keep Fri</button></div></div>`;
 else if(p.turn==='me') now=`<div class="nowcard"><span class="tag violet">Your turn</span><h3 style="margin-top:12px">${p.sub}</h3><p class="meta" style="margin:0 0 14px">"With or without music on the outro? And which cover do you like?" — ${edName(p)}</p><button class="btn-main" data-act="go" data-to="thread" data-k="${p.ed}">Reply to ${edName(p)}</button></div>`;
 else now=`<div class="nowcard"><span class="tag grey">Waiting on ${edName(p)}</span><h3 style="margin-top:12px">${p.v?`v${p.v+1}`:'First cut'} due ${p.due}</h3><p class="meta" style="margin:0 0 14px">${p.sub}. We'll tell you the moment it lands.</p><button class="btn-sec" style="width:100%" data-act="${p.v?'openReview':'noop'}" data-id="${p.id}">${p.v?`Watch v${p.v} again`:'Nothing to watch yet'}</button></div>`;
 const rows=[['compare','Versions',p.v?`v${p.v} current${p.v>1?' · v'+(p.v-1):''}${p.v>2?' · v1':''}`:'v1 comes from '+edName(p),'versions'],['footage','Footage','6 clips · received','footage'],['list','Brief and references','2 reference videos','brief'],['cover','Cover and caption','Auto: frame at 0:21 · tap to change','coverpick'],['money','Money',`$${p.price||75} · $${(p.price||75)/2} on approval`,'money'],['people','People',`You + ${edName(p)} · Share link to invite`,'people']];

let RV=null;
const canNoteP=p=>p.turn==='me'&&p.status!=='done'&&p.v>0&&!p.asks;
V.review=({id})=>{const p=proj(id);
 RV={id,t:p.newV||!p.v?(p.v?2:0):12,playing:false,timer:null,mode:null,cmp:false,full:false,tool:'pen',ra:12,rb:16,pend:null};
 const frames=Array.from({length:8},(_,i)=>p.v?`<i style="${bg(p.vimg)};background-position:${i*14}% ${30+i*5}%"></i>`:'<i style="background:#1C1C1E"></i>').join('');
 const sub=p.status==='done'?`Done · v${p.v} is final`:!p.v?`Waiting for v1 · round 1 of ${p.rounds}`:canNoteP(p)?`Your turn · v${p.v} · round ${p.round} of ${p.rounds}`:(p.asks?`${edName(p)} asks +1 day · v${p.v}`:`Waiting on ${edName(p)} · v${p.v} · round ${p.round} of ${p.rounds}`);

  <div class="strip" id="strip"><div class="frames">${frames}</div><div id="pins"></div><div id="rng"></div><div class="ph" id="ph"></div></div>
  <div id="decide"></div>
  <div id="bottom"></div></div>`,
  mount(el){drawPins();drawBottom();setT(RV.t);
   if(!canNoteP(p)&&!p.asks&&p.status!=='done'&&S.role!=='editor'){RV.cd=10;RV.cdt=setInterval(()=>{RV.cd--;const c=$('#acd');if(c)c.textContent=RV.cd;if(RV.cd<=0){clearInterval(RV.cdt);if(rvP()===p&&stack[stack.length-1]?.params?.id===p.id)act.simUpload({dataset:{id:p.id}});}},1000);}
   $('#vid',el).addEventListener('click',e=>{ if(e.target.closest('.pbtn'))return; if(RV.mode==='draw'||RV.cmp) return; if(!canNoteP(p)){act.playpause();return;} addNoteAt(); });

  if(c===6)go('all');
  if(c===7)act.allDone();
  if(c===8)go('project',{id:'mr'});
  if(c===9){go('project',{id:'mr'});setTimeout(()=>act.editName({dataset:{id:'mr'}}),520);}}
});
function filterSheet(keep){const f=S.filter;const n=filtered().length;
 const html=`<div style="display:flex;align-items:center;margin:4px 0 4px"><h3 class="t20" style="flex:1">Filter</h3><button class="lab" style="color:var(--meta)" data-act="fClear">Clear</button></div>
 <label class="lbl">Status</label><div class="chips">${[['all','All'],['progress','In progress'],['done','Done']].map(([v,l])=>`<button class="chip ${f.status===v?'on':''}" data-act="fStatus" data-v="${v}">${l} ${S.projects.filter(p=>v==='all'||p.status===v).length}</button>`).join('')}</div>
 <label class="lbl">Type · pick any</label><div class="chips">${['Vlog','Food','Talking head','Product','Travel'].map(t=>`<button class="chip ${f.types.includes(t)?'on':''}" data-act="fType" data-v="${t}">${t} ${S.projects.filter(p=>p.type===t).length}</button>`).join('')}</div>
 <label class="lbl">Sort</label><div class="seg">${['Newest','Deadline','Last change'].map(s=>`<button class="${f.sort===s?'on':''}" data-act="fSort" data-v="${s}">${s}</button>`).join('')}</div>
 <div style="margin-top:20px"><button class="btn-main" data-act="fShow" ${n?'':'disabled'}>Show ${n} project${n===1?'':'s'}</button></div>`;
 if(keep&&$('#sheet-host').classList.contains('open')){$('#sheet-host .sbody').innerHTML=html;}else openSheet(html);}

/* ================= event delegation ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=act[el.dataset.act]; if(!a) return;
  if(el.closest('#phone')&&el.dataset.act!=='closeSheet'&&el.tagName!=='INPUT') {}
  a(el,e);
});
document.addEventListener('input',e=>{if(e.target.id==='aq'){const q=e.target.value.toLowerCase().trim();$$('.gcard').forEach(g=>g.style.display=!q||g.dataset.title.includes(q)?'':'none');}});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();} });
// drag sheet down to close
(()=>{const sh=$('.sheet');let y0=null,dy=0;$('.grab').addEventListener('pointerdown',e=>{y0=e.clientY;sh.style.transition='none';$('.grab').setPointerCapture(e.pointerId);});
 $('.grab').addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`;});
 $('.grab').addEventListener('pointerup',()=>{sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet();y0=null;dy=0;});})();

/* ================= keep the phone fixed + fit to window ================= */
(()=>{const ph=$('#phone');['#phone','#views'].forEach(sel=>{const n=$(sel);n.addEventListener('scroll',()=>{n.scrollTop=0;n.scrollLeft=0;});});
 const fit=()=>{if(innerWidth<=500){ph.style.transform='';ph.style.margin='';return;}const sc=Math.min(1,(innerHeight-44)/(844+22));ph.style.transform=sc<1?`scale(${sc})`:'';ph.style.margin=sc<1?`${-(844*(1-sc))/2}px ${-(390*(1-sc))/2}px`:'';};
 addEventListener('resize',fit);fit();})();
/* ================= boot ================= */
S=freshState();
reset('splash',{},'none');
</script>
</body>
